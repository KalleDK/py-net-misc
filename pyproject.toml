[project]
name = "net-misc"
version = "0.1.1.1"
description = "Add misc utils for networking calculations"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Kalle M. Krog Aagaard", email = "git@k-moeller.dk"},
]
maintainers = [
    {name = "Kalle M. Krog Aagaard", email = "git@k-moeller.dk"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
]

[project.urls]
Homepage = "https://github.com/KalleDK/py-net-misc"
Documentation = "https://github.com/KalleDK/py-net-misc"
Repository = "https://github.com/KalleDK/py-net-misc.git"

[dependency-groups]
test = [
    "pytest>=9.0.2",
]
stubs = []

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "net_misc"

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
